# One triggered trial, then everything concludes. Used by
# triggered_capture.launch.py:  ARMED -> trigger -> one 15 s trial with two
# markers drawn at random from the pool -> data saved to the bag -> shut down.
#
# There is no `schedule:` block: a `trigger:` block makes a run exactly one
# trial. (Set schedule.max_trials only if you want a trigger to fire a batch.)
schema: mosquito_preference_assay/experiment/1
name: single_trigger
description: One trigger, one 15 s trial, two markers drawn at random.

stimuli:
  static_dark:
    type: static_dark
    params: {fill_gray: 20}
  jitter:
    type: jitter
    params: {fill_gray: 20, amplitude_px: 20, noise_speed: 1.2}
  moving_grating:
    type: moving_grating
    params:
      period_px: 24
      speed_px_per_sec: 40
      angle_deg: {uniform: [0, 360]}
  telescope:
    type: telescope
    params: {ring_spacing_px: 18, speed_px_per_sec: 50}

conditions:
  mode: sample                 # draw 2 distinct markers at random each trial
  # pool: [...]                 # default: all stimuli
  # weights: {...}              # optional bias

duration_sec: 15.0             # <-- the single knob for trial length

# What fires the trial. Set `topic` to whatever your tracking / arena node
# publishes (a std_msgs/Bool, true = go). `node: foo` is shorthand for
# topic /foo/trigger. A `trigger_topic` ROS param still overrides this.
trigger:
  topic: /arena/mosquito_present

display:
  circle_diameter_px: 200
  left_center_px: null          # null -> auto (w*0.25, h/2)
  right_center_px: null
  background_gray: 128
