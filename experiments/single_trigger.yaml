# One triggered trial, then everything concludes. Used by
# triggered_capture.launch.py:  ARMED -> trigger -> one 15 s trial with two
# markers drawn at random from the pool -> data saved to the bag -> shut down.
schema: mosquito_preference_assay/experiment/1
name: single_trigger
description: One trigger, one 15 s trial, two markers drawn at random.

stimuli:
  static_dark:
    type: static_dark
    params: {fill_gray: 20}
  jitter:
    type: jitter
    params: {fill_gray: 20, amplitude_px: 20, noise_speed: 1.2}
  moving_grating:
    type: moving_grating
    params:
      period_px: 24
      speed_px_per_sec: 40
      angle_deg: {uniform: [0, 360]}
  telescope:
    type: telescope
    params: {ring_spacing_px: 18, speed_px_per_sec: 50}

conditions:
  mode: sample                 # draw 2 distinct markers at random each trial
  # pool: [...]                 # default: all stimuli
  # weights: {...}              # optional bias

duration_sec: 15.0             # <-- the single knob for trial length

# What fires the trial. `topic` matches what mosquito_detector_node publishes
# to by default (see README "Detecting a mosquito"), and what test_trigger
# defaults to for bench testing. `node: foo` is shorthand for topic
# /foo/trigger. `trigger_topic` / `trigger_msg_type` ROS params still
# override these.
trigger:
  topic: /arena/mosquito_present
  # msg_type: bool (default) -- test_trigger / a plain std_msgs/Bool source.
  # For the real camera pipeline (mosquito_detector_node's detection-event
  # JSON, any message = go), either uncomment the line below or launch with
  # -p trigger_msg_type:=string -- no file edit needed.
  # msg_type: string

display:
  circle_diameter_px: 200
  left_center_px: null          # null -> auto (w*0.25, h/2)
  right_center_px: null
  background_gray: 128
