# One 15-second two-choice presentation, played once when triggered, then the
# run ends (node shuts down -> launch stops the rosbag). Pair with:
#   ros2 launch mosquito_preference_assay triggered_capture.launch.py
schema: mosquito_preference_assay/experiment/1
name: single_trigger_15s
description: One 15 s static-dark vs moving-grating presentation per launch.

stimuli:
  static_dark:
    type: static_dark
    params: {fill_gray: 20}
  moving_grating:
    type: moving_grating
    params:
      period_px: 24
      speed_px_per_sec: 40
      angle_deg: {uniform: [0, 360]}

conditions:
  mode: pairs
  generate: none
  explicit:
    - {left: static_dark, right: moving_grating}

schedule:
  order: sequential
  loop: false
  max_trials: 1            # belt-and-braces: exactly one trial

trial:
  duration_sec: 15.0

display:
  circle_diameter_px: 200
  background_gray: 128
