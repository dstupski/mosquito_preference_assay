# Example: a control vs. gratings of three speed bands. Shows a restricted
# condition pool, random-range params, a per-trial jittered duration, and a
# finite run (one shuffled pass, then "experiment complete").
schema: mosquito_preference_assay/experiment/1
name: grating_speed_sweep
description: Static-dark control against slow / medium / fast drifting gratings.

stimuli:
  control:
    type: static_dark
    params: {fill_gray: 20}

  grating_slow:
    type: moving_grating
    params:
      period_px: 24
      speed_px_per_sec: {uniform: [8, 16]}
      angle_deg: {choice: [0, 90]}

  grating_medium:
    type: moving_grating
    params:
      period_px: 24
      speed_px_per_sec: {uniform: [30, 50]}
      angle_deg: {choice: [0, 90]}

  grating_fast:
    type: moving_grating
    params:
      period_px: 24
      speed_px_per_sec: {uniform: [80, 120]}
      angle_deg: {choice: [0, 90]}

conditions:
  mode: pairs                          # cycle a fixed set, not random draws
  generate: none                       # only the explicit pairings below
  explicit:
    - {left: control, right: grating_slow}
    - {left: control, right: grating_medium}
    - {left: control, right: grating_fast}

schedule:
  order: shuffle
  loop: false                          # one pass, then complete
  side_assignment: random

trial:
  duration_sec: {uniform: [25, 35]}

display:
  circle_diameter_px: 220
  background_gray: 128
