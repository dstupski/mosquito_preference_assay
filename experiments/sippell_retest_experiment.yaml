# Does a wandering target attract, and does wandering further attract more?
#
# Five stimuli, so ten possible pairings. mode: sample draws two distinct ones
# per trial, so across enough animals every pairing is sampled:
#
#     blank          nothing at all      -- is anything better than nothing?
#     static_black   a still dark circle -- is MOTION doing the work, or is a
#                                           dark target enough?
#     jitter_25      wanders +/-25 px  ─┐
#     jitter_50      wanders +/-50 px   ├ the dose-response
#     jitter_75      wanders +/-75 px  ─┘
#
# The three jitters are one manipulation at three levels, evenly spaced 1:2:3.
# Everything else about them is identical -- same fill, same noise_speed, same
# diameter -- so amplitude is the only thing that varies across the set.
#
# AMPLITUDE HAS A CEILING, set by the rig's geometry, not by taste. Two
# circles jittering toward each other close the gap between them by twice the
# amplitude:
#
#     edge gap  = separation - diameter
#     max safe amplitude = edge gap / 2
#
# On a rig with separation 395 px and diameter 220 px the gap is 175 px, so
# the ceiling is ~86 px and 75 leaves 25 px of clear space at worst case.
# CHECK THIS FOR YOUR RIG: read separation and diameter out of
# config/display_geometry.local.yaml after aligning. If the circles can touch,
# a "preference" measured near the midline is not a preference between two
# stimuli, it is a response to one merged object.
#
# SEEDS ARE INDEPENDENT per amplitude, which is a deliberate change from the
# earlier two-jitter version of this file. There, both jitters shared seeds so
# they traced the same path and differed in amplitude alone, with one mirrored
# so they did not move in lockstep. That does not extend to three: with ten
# pairings, any two shared-seed jitters paired together move as scaled copies
# of each other, which reads as one object seen twice. Independent seeds cost
# the exactly-matched path -- over a short window Perlin noise does not
# reliably show a 2x amplitude as 2x the excursion (measured 1.57x) -- but the
# dose-response here is carried by the SET across many animals, not by one
# matched pair within a trial.
#
# To go back to matched paths, give all three the same seed_x / seed_y and
# accept lockstep when two of them are drawn together.
#
# WHAT VARIES BETWEEN ANIMALS. A jitter's position is a pure function of
# elapsed time -- nothing is drawn per frame from a random source -- but the
# Perlin field is re-seeded per run from master_seed, which is random unless
# pinned. So each animal sees a different trajectory at the same amplitude.
# That is unbiased across conditions, since all three jitters shift
# together, but it is variance you are carrying. It cannot be removed by
# pinning master_seed, because that also fixes which pair is drawn: every
# animal would then see the same two stimuli.
#
# ---------------------------------------------------------------------------
# RIG SETUP LIVES ELSEWHERE. Nothing in this file is machine-specific, so the
# same file runs on any rig and two rigs running it show the same thing.
# Which screen, and where on it, comes from your assay params instead:
#
#     ros2 launch mosquito_preference_assay arena_experiment.launch.py \
#         experiment_file:=sippell_retest_experiment
#
# The rig's half lives in config/assay_params.local.yaml and in the
# calibration display_check writes. Those override the display: block below --
# centres AND diameter -- so leave this file rig-independent.
# ---------------------------------------------------------------------------
schema: mosquito_preference_assay/experiment/1
name: sippell_retest_experiment
description: >-
  Blank and static-dark controls against three jitter amplitudes, to separate
  "is it moving" from "how far is it moving". Stimulus position is published
  per frame on ~/stimulus_position so a flight track can be related to where
  the target actually was.

stimuli:
  # 1. empty side -- the floor of the assay
  blank:
    type: blank

  # 2. present but motionless -- separates "a target" from "a moving target"
  static_black:
    type: static_dark
    params: {fill_gray: 20}

  # --- 3-5. the dose-response. Identical but for amplitude. -----------------
  jitter_25:
    type: jitter
    params:
      fill_gray: 20
      amplitude_px: 25
      noise_speed: 1.2
      # Offsets into the shared Perlin field -- distinct per amplitude, so
      # the three wanders are independent rather than scaled copies. See
      # the header for why they are not shared.
      #
      # These do NOT make the path identical across animals: the field
      # itself is re-seeded each run from master_seed, so every animal gets
      # a different trajectory of the same amplitude and character. Pinning
      # master_seed would fix the path but also fix the pairing draw, so
      # every animal would see the same pair -- see the header.
      seed_x: 111.0
      seed_y: 777.0

  jitter_50:
    type: jitter
    params:
      fill_gray: 20
      amplitude_px: 50
      noise_speed: 1.2
      seed_x: 222.0
      seed_y: 888.0

  jitter_75:
    type: jitter
    params:
      fill_gray: 20
      amplitude_px: 75
      noise_speed: 1.2
      seed_x: 333.0
      seed_y: 999.0

conditions:
  # Two distinct stimuli per trial, drawn at random, sides randomised. Ten
  # pairings now rather than six, so an even sample needs proportionally more
  # animals -- if that is too many, mode: pairs below runs only the
  # comparisons you care about.
  mode: sample

  # mode: pairs
  # pairs:
  #   - {a: jitter_25,    b: jitter_75}     # the amplitude question, widest step
  #   - {a: static_black, b: jitter_50}     # does motion matter at all
  #   - {a: blank,        b: static_black}  # does a target matter at all
  #
  # {a, b} randomises which side each lands on; {left, right} pins them.

duration_sec: 15.0

display:
  circle_diameter_px: 220

  # White ground, so the dark circles are maximum contrast.
  background_gray: 255

  # null -> auto: left at a quarter of the screen width, right at three
  # quarters, both at mid-height. display_check's calibration overrides these
  # per rig, so leave them alone here -- this file should stay portable.
  left_center_px: null
  right_center_px: null

# Presence of this block makes the run triggered: the node opens ARMED and
# waits. arena_experiment.launch.py overrides the topic to wire the detector in.
trigger:
  topic: /arena/mosquito_present
