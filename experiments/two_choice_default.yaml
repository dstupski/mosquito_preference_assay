# Default experiment (also the built-in default used when no experiment_file
# is given). One trial: two DISTINCT markers drawn at random from the pool,
# one on the right, one on the left.
schema: mosquito_preference_assay/experiment/1
name: two_choice_default
description: Two distinct markers drawn at random from the pool.

# 1. STIMULUS POOL ---------------------------------------------------------
# Named, reusable stimulus definitions. Each param is a literal OR a random
# spec resolved per trial from the trial seed:
#   {uniform: [lo, hi]}  {randint: [lo, hi]}  {choice: [...]}  {normal: [mu, sd]}
stimuli:
  static_dark:
    type: static_dark
    params: {fill_gray: 20}

  jitter:
    type: jitter
    params: {fill_gray: 20, amplitude_px: 20, noise_speed: 1.2}

  moving_grating:
    type: moving_grating
    params:
      period_px: 24
      speed_px_per_sec: 40
      angle_deg: {uniform: [0, 360]}      # random orientation

  telescope:
    type: telescope
    params: {ring_spacing_px: 18, speed_px_per_sec: 50}

# 2. CONDITIONS --------------------------------------------------------
conditions:
  mode: sample               # sample -> draw 2 distinct at random; pairs -> pick one from `pairs`
  # pool: [static_dark, jitter, moving_grating, telescope]   # default: all stimuli
  # weights: {moving_grating: 2, static_dark: 1}             # optional bias (default: equal)

duration_sec: 15.0           # trial length in seconds

display:
  circle_diameter_px: 200
  left_center_px: null       # null -> auto (w*0.25, h/2)
  right_center_px: null      # null -> auto (w*0.75, h/2)
  background_gray: 128
